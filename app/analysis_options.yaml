# Dart analyzer config for the Period-Tracker app. See docs/PLAN.md 5.1.
#
# Base ruleset is very_good_analysis, which is meaningfully stricter than
# flutter_lints. The extra public_member_api_docs requirement is scoped to
# lib/domain/ through a nested analysis_options.yaml in that directory, because
# domain/ is pure Dart and is the surface the golden vectors and the entire app
# depend on (DECISIONS.md ADR-0002).

include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - linux/**
    - macos/**
    - web/**
    - windows/**
    # Generated code. CI runs build_runner before analyze, so these are always
    # reproducible and are never hand-edited.
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"

  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    unused_import: error
    unused_local_variable: error
    dead_code: error
    # TODOs are allowed but must stay visible rather than silently accumulating.
    todo: info

linter:
  rules:
    # Raised to `true` inside lib/domain/ only. Documenting every private widget
    # in features/ is ceremony; documenting the prediction core is not.
    public_member_api_docs: false
    # dart format already caps code at 80 columns. Keeping this lint on top of
    # it only fires on long string literals and URLs in comments, which the
    # formatter cannot split anyway.
    lines_longer_than_80_chars: false
