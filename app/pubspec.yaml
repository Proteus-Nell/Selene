name: period_tracker
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+10000

environment:
  sdk: ^3.13.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  drift: ^2.34.3
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_localizations:
    sdk: flutter
  # PINNED BELOW 3.x DELIBERATELY. riverpod 3.x declares `test: ^1.0.0` as a
  # regular dependency, not a dev dependency, which pulls package:test and with
  # it shelf, shelf_static and webkit_inspection_protocol into the app's runtime
  # dependency graph. An HTTP server in the production graph is exactly what
  # "no network-capable dependency permitted in pubspec.lock" (docs/PLAN.md 6.5)
  # exists to prevent. Revisit only if riverpod moves that dependency to
  # dev_dependencies.
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  local_auth: ^3.0.2
  meta: ^1.19.0
  path: ^1.9.1
  path_provider: ^2.1.6
  pointycastle: ^4.0.0
  sqlite3: ^3.5.1
  timezone: ^0.11.1
  url_launcher: ^6.3.2
dev_dependencies:
  build_runner: ^2.15.1
  # Test-only, deliberately not a runtime dependency: it exists so the priors
  # test can hash artifacts/priors/priors_v1.json and prove the generated
  # constants in lib/domain/predict/priors_bundled.dart are not stale. Nothing
  # under lib/ imports it, which keeps the prediction core dependency-free.
  crypto: ^3.0.6
  drift_dev: ^2.34.5
  file_selector_platform_interface: ^2.7.0
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  freezed: ^4.0.0-dev.3
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1
  very_good_analysis: ^10.3.0
  xml: ^7.0.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # Generates AppLocalizations from lib/l10n/*.arb. Assumption A4: English only
  # for MVP, but localization-ready from day one, because retrofitting l10n
  # after the UI exists is a multi-day refactor.
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Figtree, bundled rather than fetched (AND-34). This app has no network
  # permission, so a webfont is not on the table even if it were wanted, and
  # the system font is not the same shape on every Android skin: a health
  # record that reflows differently on someone else's phone is a layout nobody
  # has tested.
  #
  # Four static weights, 96KB in total. Google Fonts' **latin subset** (222
  # codepoints), which covers every character in lib/l10n/app_en.arb — a future
  # non-English locale would need a wider subset, and `fonts_test.dart` checks
  # the coverage rather than trusting this comment.
  #
  # LICENCE: SIL Open Font License 1.1. assets/fonts/OFL.txt carries the
  # copyright notice and the licence text, and it SHIPS WITH THE FONTS — the
  # OFL requires the notice and licence to travel with the font files, so it is
  # listed as an asset below rather than left in the repository. Removing it
  # while keeping the .ttf files would make the app's distribution
  # non-compliant, which is why `fonts_test.dart` fails if it goes missing.
  assets:
    - assets/fonts/OFL.txt
    # The medicines reference, built by tools/scripts/gen_medicines.py from
    # openFDA's label export: a compressed index and about sixty compressed
    # chunks of label text, 13 MB in all (ADR-0012, ADR-0013). Read off the
    # assets, never fetched: the app has no INTERNET permission (ADR-0004).
    - assets/medicines/
    # The herbal supplements reference, built by tools/scripts/gen_supplements.py
    # from NCCIH's Herbs at a Glance fact sheets, which are in the public domain:
    # one JSON file of about 260 KB (ADR-0023). Read off the assets as the
    # medicines are, never fetched.
    - assets/supplements/

  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-400.ttf
          weight: 400
        - asset: assets/fonts/Figtree-500.ttf
          weight: 500
        - asset: assets/fonts/Figtree-600.ttf
          weight: 600
        - asset: assets/fonts/Figtree-700.ttf
          weight: 700

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
