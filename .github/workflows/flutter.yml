name: flutter

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Keep in step with app/.fvmrc. The first job step fails the build if they drift.
env:
  FLUTTER_VERSION: "3.47.0"
  # Matches the local toolchain (Android Studio JBR 21) so CI and desktop builds
  # are reproducible against each other. AGP 9.x supports 17 and 21; the system
  # JDK 25 is unsupported, which is why this is pinned at all. DECISIONS.md
  # ADR-0005, as narrowed by ADR-0006.
  JAVA_VERSION: "21"

jobs:
  app:
    name: analyze, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify workflow and .fvmrc agree on the Flutter version
        run: |
          pinned="$(python3 -c "import json;print(json.load(open('app/.fvmrc'))['flutter'])")"
          if [ "$pinned" != "${FLUTTER_VERSION}" ]; then
            echo "::error::app/.fvmrc pins '$pinned' but this workflow uses '${FLUTTER_VERSION}'"
            exit 1
          fi
          echo "Flutter pin agrees: $pinned"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate code
        working-directory: app
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format check
        working-directory: app
        # Deliberately scoped to lib and test rather than `.`: `dart format .`
        # crashes walking build/ after an Android build, on a Gradle desugar
        # intermediate directory with a very long path.
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test --coverage

      - name: Forbid DateTime.now() outside core/clock.dart
        run: bash tools/scripts/check_no_datetime_now.sh

      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Assert release APK declares no network permission
        run: bash tools/scripts/assert_no_network.sh app/build/app/outputs/flutter-apk/app-release.apk

      - name: Negative control, the debug APK must FAIL the same check
        # Without this, assert_no_network.sh could silently degrade into a no-op
        # (wrong aapt2 path, changed dump format) and CI would still be green
        # while the privacy guarantee went unverified. The debug APK genuinely
        # declares INTERNET for hot reload, so it is a permanent, free control.
        run: |
          if bash tools/scripts/assert_no_network.sh app/build/app/outputs/flutter-apk/app-debug.apk; then
            echo "::error::assert_no_network.sh passed an APK that declares INTERNET. The check is broken."
            exit 1
          fi
          echo "Negative control OK: debug APK correctly rejected."

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
