name: flutter

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Keep in step with app/.fvmrc. The first job step fails the build if they drift.
env:
  FLUTTER_VERSION: "3.47.0"
  # Matches the local toolchain (Android Studio JBR 21) so CI and desktop builds
  # are reproducible against each other. AGP 9.x supports 17 and 21; the system
  # JDK 25 is unsupported, which is why this is pinned at all. DECISIONS.md
  # ADR-0005, as narrowed by ADR-0006.
  JAVA_VERSION: "21"

jobs:
  app:
    name: analyze, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify workflow and .fvmrc agree on the Flutter version
        run: |
          pinned="$(python3 -c "import json;print(json.load(open('app/.fvmrc'))['flutter'])")"
          if [ "$pinned" != "${FLUTTER_VERSION}" ]; then
            echo "::error::app/.fvmrc pins '$pinned' but this workflow uses '${FLUTTER_VERSION}'"
            exit 1
          fi
          echo "Flutter pin agrees: $pinned"

      - name: Verify the generated priors match the committed artifact
        # priors_bundled.dart is generated from artifacts/priors/priors_v1.json.
        # Exporting new priors without regenerating it would ship an app whose
        # model no longer matches the artifact the golden vectors were built
        # from, which is the drift ADR-0002 exists to prevent.
        run: python3 tools/scripts/gen_priors_dart.py --check

      - name: Verify the medicines bundle, its selection and its Dart agree
        # Same drift guard as the priors above. The generated Dart carries the
        # bundle's checksum, count and export date, and the lookup shows the
        # date, so a rebuilt bundle that nobody regenerated the Dart from would
        # show the previous export's date over the new export's text. It also
        # checks that every drug's line in the bundle is the one its index
        # names. This step needs no network — the fetch happens in `--fetch`,
        # on a developer machine.
        run: python3 tools/scripts/gen_medicines.py --check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate code
        working-directory: app
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format check
        working-directory: app
        # Deliberately scoped to lib and test rather than `.`: `dart format .`
        # crashes walking build/ after an Android build, on a Gradle desugar
        # intermediate directory with a very long path.
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        working-directory: app
        run: flutter analyze

      # Run before the full suite so a failure names itself. `flutter test`
      # below covers these files again; the cost is a few seconds and the
      # benefit is that "accessibility gate failed" appears in the job list
      # rather than being one red line inside 600 passing tests.
      - name: Accessibility gate
        working-directory: app
        run: >
          flutter test
          test/features/a11y_test.dart
          test/features/text_scale_goldens_test.dart
          test/features/calendar_test.dart

      # Same reasoning as the gate above: this is the one test that runs the
      # whole app in sequence, so when it breaks it should say so by name
      # rather than as one red line inside the full suite. It is run again by
      # the step below; the duplication costs about five seconds.
      - name: End-to-end smoke flow
        working-directory: app
        run: flutter test test/e2e_smoke_test.dart

      - name: Test
        working-directory: app
        run: flutter test --coverage

      - name: Forbid DateTime.now() outside core/clock.dart
        run: bash tools/scripts/check_no_datetime_now.sh

      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug

      # Split per ABI, per docs/PLAN.md 3.7: a universal APK carries every
      # architecture's native libraries, and this app ships a native SQLite.
      - name: Build release APKs
        working-directory: app
        run: flutter build apk --release --split-per-abi

      # Every artifact that could be installed is checked, not just one. The
      # split builds are what actually get distributed, so checking a universal
      # APK nobody ships would be proving the wrong thing.
      - name: Assert no release APK declares a network permission
        run: |
          shopt -s nullglob
          apks=(app/build/app/outputs/flutter-apk/app-*-release.apk)
          if (( ${#apks[@]} == 0 )); then
            echo "::error::no release APKs were produced"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            bash tools/scripts/assert_no_network.sh "$apk"
          done

      - name: Negative control, the debug APK must FAIL the same check
        # Without this, assert_no_network.sh could silently degrade into a no-op
        # (wrong aapt2 path, changed dump format) and CI would still be green
        # while the privacy guarantee went unverified. The debug APK genuinely
        # declares INTERNET for hot reload, so it is a permanent, free control.
        run: |
          if bash tools/scripts/assert_no_network.sh app/build/app/outputs/flutter-apk/app-debug.apk; then
            echo "::error::assert_no_network.sh passed an APK that declares INTERNET. The check is broken."
            exit 1
          fi
          echo "Negative control OK: debug APK correctly rejected."

      # AND-31 budgets the medicines data at under a megabyte of added APK.
      #
      # The megabyte is enforced on the artifact and its generated Dart, in
      # `medicines_test.dart`, because that is the input we control and can
      # measure. A true "growth" assertion would need both APKs — one built
      # without the artifact and one with — and comparing against a hardcoded
      # baseline instead would be comparing against a number that goes stale
      # on the next unrelated dependency bump.
      #
      # This step is the backstop for that: it records the real per-ABI sizes
      # on every run, so a jump is visible in the log and in the diff of any
      # future baseline, and it fails on a size that could only mean something
      # went badly wrong. A phone installs one ABI, so the budget is per-APK.
      - name: Record release APK sizes, and fail on an implausible one
        run: |
          shopt -s nullglob
          limit=$((60 * 1024 * 1024))
          for apk in app/build/app/outputs/flutter-apk/app-*-release.apk; do
            size=$(stat -c%s "$apk")
            printf '%s: %s bytes (%s MiB)\n' \
              "$(basename "$apk")" "$size" "$((size / 1024 / 1024))"
            if (( size > limit )); then
              echo "::error::$(basename "$apk") is $size bytes, far over what this app should ever be. Something is being bundled that should not be."
              exit 1
            fi
          done

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apks
          path: app/build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
