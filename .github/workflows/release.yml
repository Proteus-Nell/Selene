name: release

# A release is a tag. Pushing `v1.2.3` builds that commit with the release key,
# checks it the way CI and tools/scripts/release.sh do, and leaves a draft
# release with the APKs, their checksums and the signing certificate's
# fingerprint. Publishing the draft is a person's decision, after the upgrade
# check in docs/RELEASE.md section 3 that no workflow can do.
#
# Why this exists: a CI build is signed with a debug key that every runner makes
# afresh, so no CI build will ever install over another, and none will update an
# installed copy. Every release is signed with the same key, and its version code
# comes from its version name, so each one installs over the one before it.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# Same pins as flutter.yml, for the same reasons.
env:
  FLUTTER_VERSION: "3.47.0"
  JAVA_VERSION: "21"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: build, sign, draft
    runs-on: ubuntu-latest
    permissions:
      # To create the draft release. Nothing else in this job writes.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Every tag and main, for the two checks below.
          fetch-depth: 0

      - name: Check the tag, the version name and the version code agree
        id: version
        # The code is derived from the name, so a later release always has a
        # higher one. This refuses a tag that does not match pubspec.yaml, a
        # pubspec that breaks the rule, and a version that is not newer than
        # every one tagged before it.
        run: python3 tools/scripts/release_version.py check "${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} is not on main. Releases are cut from main only."
            exit 1
          fi

      - name: Check the signing key is configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Before anything slow, so a missing secret costs seconds, not a build.
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Repository secrets missing: ${missing[*]}. See docs/RELEASE.md section 6."
            exit 1
          fi

      - name: Verify workflow and .fvmrc agree on the Flutter version
        run: |
          pinned="$(python3 -c "import json;print(json.load(open('app/.fvmrc'))['flutter'])")"
          if [ "$pinned" != "${FLUTTER_VERSION}" ]; then
            echo "::error::app/.fvmrc pins '$pinned' but this workflow uses '${FLUTTER_VERSION}'"
            exit 1
          fi

      - name: Verify the generated priors and medicines match their artifacts
        run: |
          python3 tools/scripts/gen_priors_dart.py --check
          python3 tools/scripts/gen_medicines.py --check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate code
        working-directory: app
        run: dart run build_runner build --delete-conflicting-outputs

      # The tagged commit has been through CI already, but a release is built
      # here rather than taken from there, so it is tested here too.
      - name: Analyze and test
        working-directory: app
        run: |
          flutter analyze
          flutter test

      - name: Forbid DateTime.now() outside core/clock.dart
        run: bash tools/scripts/check_no_datetime_now.sh

      - name: Install the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Outside the working tree, readable by this user only, and removed in
        # the last step whatever happens. key.properties is gitignored. A
        # backslash in a password is escaped, because the build reads the file
        # as Java properties, where a backslash starts an escape.
        run: |
          umask 077
          keystore="${RUNNER_TEMP}/release.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "$keystore"
          {
            printf 'storePassword=%s\n' "${ANDROID_KEYSTORE_PASSWORD//\\/\\\\}"
            printf 'keyPassword=%s\n' "${ANDROID_KEY_PASSWORD//\\/\\\\}"
            printf 'keyAlias=%s\n' "${ANDROID_KEY_ALIAS}"
            printf 'storeFile=%s\n' "$keystore"
          } > app/android/key.properties

      # The same script a release built on a laptop goes through: release key,
      # one version code across every APK, no network permission.
      - name: Build the release APKs
        run: bash tools/scripts/release.sh

      - name: Name, checksum and describe the APKs
        env:
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          out=app/build/app/outputs/flutter-apk
          mkdir dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "$out/app-$abi-release.apk" "dist/selene-$NAME-$abi.apk"
          done
          ( cd dist && sha256sum -- *.apk > SHA256SUMS.txt )

          # The same reader release.sh uses, which fails loudly when it cannot
          # recognise apksigner's report rather than returning an empty one.
          # This step used to parse the report itself, and when build-tools
          # 37.0.0 answered differently it reported certificates that disagreed
          # without having read any (v1.1.0, 2026-10-29).
          digests="$(for apk in dist/*.apk; do
            bash tools/scripts/apk_signer_cert.sh --digest "$apk"
          done | sort -u)"
          if [[ "$(wc -l <<<"$digests")" != 1 ]]; then
            echo "::error::The APKs are not all signed by one certificate."
            printf 'digests found:\n%s\n' "$digests" >&2
            exit 1
          fi
          fingerprint="$(tr 'a-f' 'A-F' <<<"$digests" | sed 's/../&:/g; s/:$//')"

          cat > notes.md <<NOTES
          ## Installing

          Download **selene-$NAME-arm64-v8a.apk**, the one nearly every phone made since 2017 needs. \`armeabi-v7a\` is for older 32-bit phones and \`x86_64\` for emulators. Android will ask you to allow installs from your browser or file manager the first time.

          ## Updating

          Install the new APK over the old one. Your data stays where it is: every release is signed with the same key and has a higher version code than the one before (this one is $CODE).

          **Coming from a build that was not a release**, such as an APK from a CI run or one built on your own machine, Android will refuse to install over it, because it was signed with a different key. Before uninstalling it, save a backup with **Settings, Export a backup**. Then uninstall the old app, install this one, and use **Settings, Restore from a backup**. This is needed once.

          ## Checking the download

          The SHA-256 of each APK is in \`SHA256SUMS.txt\`. Every release is signed by the certificate with this SHA-256 fingerprint:

          \`$fingerprint\`

          \`apksigner verify --print-certs\` on the APK should show the same, in lowercase without the colons.

          NOTES

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.version.outputs.name }}
        # A draft, not a published release. Publishing is the last box on the
        # checklist in docs/RELEASE.md section 3, ticked once this build has
        # installed over the previous release on a real phone.
        run: >
          gh release create "${GITHUB_REF_NAME}"
          dist/*.apk dist/SHA256SUMS.txt
          --draft
          --verify-tag
          --title "Selene V${NAME}"
          --notes-file notes.md
          --generate-notes

      - name: Remove the signing key
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.jks" app/android/key.properties
