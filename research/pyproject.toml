[project]
name = "cyclecore"
version = "0.1.0"
description = "Reference implementation, priors, and backtests for the Period-Tracker on-device model"
requires-python = "==3.11.*"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.1,<3",
  "scipy>=1.14,<2",
  "pandas>=2.2,<3",
  "pyarrow>=18,<21",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "pyyaml>=6,<7",
  "typer>=0.15,<1",
  "structlog>=24.4,<26",
]

[project.optional-dependencies]
# Deliberately NOT core. See docs/PLAN.md 3.4: the priors are a handful of
# scalars fitted by deterministic maximum marginal likelihood with scipy, so
# NUTS is not needed yet. These become worthwhile only if the hyperprior model
# grows genuinely hierarchical. Keeping them optional also keeps JAX, whose
# Windows support is CPU-only, off the default install path.
bayes = ["numpyro>=0.16,<1", "jax>=0.4.35,<1", "arviz>=0.20,<1"]
# Experiment tracking, local file store only. Needed from the backtest milestone.
track = ["mlflow>=2.19,<4"]
viz = ["matplotlib>=3.9,<4", "seaborn>=0.13,<1"]
dash = ["streamlit>=1.40,<2"]
# Tier B authoring and export. torch version is dictated by executorch.
edge = ["torch>=2.6", "executorch>=1.0"]
nb = ["jupyterlab>=4.3,<5", "ipywidgets>=8,<9"]

[project.scripts]
cyclecore = "cyclecore.cli:app"

[dependency-groups]
dev = [
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "pytest-xdist>=3.6,<4",
  "hypothesis>=6.115,<7",
  "pandas-stubs",
  "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyclecore"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "A", "C4", "SIM", "ARG", "PTH", "NPY", "RUF"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ARG"]

[tool.mypy]
python_version = "3.11"
files = ["src/cyclecore"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["scipy.*", "numpyro.*", "arviz.*", "mlflow.*", "executorch.*", "streamlit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --cov=cyclecore --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
markers = [
  "slow: takes more than 5 seconds",
  "golden: regenerates or checks cross-runtime golden vectors",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
branch = true
omit = ["src/cyclecore/cli.py"]
